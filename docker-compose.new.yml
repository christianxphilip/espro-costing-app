version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: espro-costing-mongodb
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - espro_costing_mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: espro-costing
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - espro-costing-network

  backend:
    build: ./backend
    container_name: espro-costing-backend
    restart: unless-stopped
    ports:
      - "9000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/espro-costing
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    networks:
      - espro-costing-network

  frontend:
    build: ./frontend
    container_name: espro-costing-frontend
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      # Backend API URL - uses port 9000 (external port from backend service)
      - VITE_API_URL=http://localhost:9000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - espro-costing-network

  mongo-express:
    image: mongo-express:latest
    container_name: espro-costing-mongo-express
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - espro-costing-network

volumes:
  espro_costing_mongodb_data:
    name: espro_costing_mongodb_data

networks:
  espro-costing-network:
    name: espro-costing-network
    driver: bridge
